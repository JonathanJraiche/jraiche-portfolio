<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save configuration dialog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0d131b}
a{color:#4cc9f0}a:hover{color:#f2f5f8}
</style>
</head>
<body>

<div style="width: 100%; min-height: 900px; display: flex; flex-direction: column; background: #0d131b; color: #f2f5f8; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;">
<div style="position: relative; flex: 1; display: flex; flex-direction: column;"><header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 10px 16px; background: #070b10; border-bottom: 1px solid #1c2632; position: relative; z-index: 4;">

<span style="font: 600 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; color: #f2f5f8;">SENTINEL</span>
</div>
<div style="display: flex; align-items: center; gap: 12px;">
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 4px; font: 500 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.1px; cursor: pointer; white-space: nowrap; background: #ff6b6b; color: #070b10; border: 1px solid #ff6b6b; padding: 0 24px; letter-spacing: 0.6px;">STOP</button>
<span style="display: inline-flex; align-items: center; gap: 8px; font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #f2f5f8; white-space: nowrap;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 999px; background: #4ade80; flex: none;"></span>System nominal</span>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: 1 1 0; min-width: 260px; position: relative;">
<span style="font: 400 14px/20px 'Roboto Mono', ui-monospace, Menlo, monospace; color: #96a7b8;">14:07:22Z</span>
<span style="width: 1px; height: 20px; background: #27333f;"></span>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 4px; font: 500 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.1px; cursor: pointer; white-space: nowrap; background: #1c2632; color: #f2f5f8; border: 1px solid #27333f; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add widget</button>
<button type="button" aria-label="Save configuration" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"></path><path d="M8 3v5h7V3"></path><path d="M8 21v-7h8v7"></path></svg></button>
<button type="button" aria-label="Console settings" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>

</div>
</header><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; background: #141c26; border-bottom: 1px solid #27333f;">
<span style="font: 600 15px/22px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #f2f5f8;">New configuration</span>
<span style="flex: 1 1 240px;"></span>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 4px; font: 500 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.1px; cursor: pointer; white-space: nowrap; background: transparent; color: #96a7b8; border: 1px solid transparent; ">Cancel</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 4px; font: 500 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.1px; cursor: pointer; white-space: nowrap; background: #4cc9f0; color: #070b10; border: 1px solid #4cc9f0; ">Save configuration</button>
</div><main style="flex: 1; position: relative; padding: 16px; background-color: #0d131b; background-image: radial-gradient(circle, #37475a 1px, transparent 1.6px); background-size: 24px 24px; background-position: 4px 4px;">
<div style="position: relative; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 56px; gap: 12px; min-height: 804px;">
<section aria-label="Situation Plot" style="grid-column: 1 / span 9; grid-row: 1 / span 7; position: relative; display: flex; flex-direction: column; min-width: 0; background: #141c26; border: 1px solid #27333f; border-radius: 8px;  ">
<header style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; background: #1c2632; border-bottom: 1px solid #1c2632; border-radius: 8px 8px 0 0;">
<span style="width: 6px; height: 6px; border-radius: 999px; background: #4ade80; flex: none;"></span>
<span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #96a7b8;">Situation Plot</span>
<span style="flex: 1;"></span>

<button type="button" aria-label="Situation Plot options" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
</header>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;"><span style="font: 400 12px/16px 'Roboto Mono', ui-monospace, Menlo, monospace; color: #7a8ea2;">[SITUATION PLOT CONTENT]</span></div>

</section><section aria-label="System Health" style="grid-column: 1 / span 4; grid-row: 8 / span 3; position: relative; display: flex; flex-direction: column; min-width: 0; background: #141c26; border: 1px solid #27333f; border-radius: 8px;  ">
<header style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; background: #1c2632; border-bottom: 1px solid #1c2632; border-radius: 8px 8px 0 0;">
<span style="width: 6px; height: 6px; border-radius: 999px; background: #4ade80; flex: none;"></span>
<span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #96a7b8;">System Health</span>
<span style="flex: 1;"></span>

<button type="button" aria-label="System Health options" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
</header>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;"><span style="font: 400 12px/16px 'Roboto Mono', ui-monospace, Menlo, monospace; color: #7a8ea2;">[SYSTEM HEALTH CONTENT]</span></div>

</section><section aria-label="Alert Queue" style="grid-column: 5 / span 5; grid-row: 8 / span 3; position: relative; display: flex; flex-direction: column; min-width: 0; background: #141c26; border: 1px solid #27333f; border-radius: 8px;  ">
<header style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; background: #1c2632; border-bottom: 1px solid #1c2632; border-radius: 8px 8px 0 0;">
<span style="width: 6px; height: 6px; border-radius: 999px; background: #fbbf24; flex: none;"></span>
<span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #96a7b8;">Alert Queue</span>
<span style="flex: 1;"></span>
<span style="font: 400 12px/16px 'Roboto Mono', ui-monospace, Menlo, monospace; color: #7a8ea2;">2</span>
<button type="button" aria-label="Alert Queue options" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
</header>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;"><span style="font: 400 12px/16px 'Roboto Mono', ui-monospace, Menlo, monospace; color: #7a8ea2;">[ALERT QUEUE CONTENT]</span></div>

</section><section aria-label="Event Log" style="grid-column: 10 / span 3; grid-row: 1 / span 10; position: relative; display: flex; flex-direction: column; min-width: 0; background: #141c26; border: 1px solid #27333f; border-radius: 8px;  ">
<header style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; background: #1c2632; border-bottom: 1px solid #1c2632; border-radius: 8px 8px 0 0;">
<span style="width: 6px; height: 6px; border-radius: 999px; background: #4ade80; flex: none;"></span>
<span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #96a7b8;">Event Log</span>
<span style="flex: 1;"></span>
<span style="font: 400 12px/16px 'Roboto Mono', ui-monospace, Menlo, monospace; color: #7a8ea2;">18</span>
<button type="button" aria-label="Event Log options" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
</header>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;"><span style="font: 400 12px/16px 'Roboto Mono', ui-monospace, Menlo, monospace; color: #7a8ea2;">[EVENT LOG CONTENT]</span></div>

</section>
</div>
</main><div style="position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(7, 11, 16, 0.72);">
<div role="dialog" aria-modal="true" aria-labelledby="save-title" style="width: 100%; max-width: 480px; display: flex; flex-direction: column; background: #141c26; border: 1px solid #37475a; border-radius: 8px;">
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #27333f;">
<h2 id="save-title" style="margin: 0; flex: 1; font: 600 15px/22px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #f2f5f8;">Save configuration</h2>
<button type="button" aria-label="Close" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px;">
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #96a7b8;">Name</span><input type="text" value="My watch layout" style="height: 36px; padding: 0 12px; background: #070b10; border: 1px solid #4cc9f0; border-radius: 4px; color: #f2f5f8; font: 400 14px/20px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; outline: 0;"></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #96a7b8;">Description · optional</span><textarea rows="3" style="padding: 8px 12px; background: #070b10; border: 1px solid #27333f; border-radius: 4px; color: #f2f5f8; font: 400 14px/20px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; resize: vertical; outline: 0;"></textarea></label>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid #27333f;">
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 4px; font: 500 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.1px; cursor: pointer; white-space: nowrap; background: #1c2632; color: #f2f5f8; border: 1px solid #27333f; ">Cancel</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 4px; font: 500 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.1px; cursor: pointer; white-space: nowrap; background: #4cc9f0; color: #070b10; border: 1px solid #4cc9f0; ">Save</button>
</div>
</div>
</div></div>
</div>
