<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explored: fixed layouts by sign-in role</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0d131b}
a{color:#4cc9f0}a:hover{color:#f2f5f8}
</style>
</head>
<body>

<div style="width: 100%; min-height: 900px; display: flex; flex-direction: column; background: #0d131b; color: #f2f5f8; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;">
<header style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #070b10; border-bottom: 1px solid #1c2632;"><span style="font: 600 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; color: #f2f5f8;">SENTINEL</span></header>
<main style="flex: 1; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; padding: 40px 32px; box-sizing: border-box;">
<form aria-label="Sign in" style="flex: 0 1 340px; display: flex; flex-direction: column; gap: 16px; padding: 20px; background: #141c26; border: 1px solid #27333f; border-radius: 8px;">
<h1 style="margin: 0; font: 600 20px/28px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #f2f5f8;">Sign in</h1>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #96a7b8;">Operator ID</span><input type="text" placeholder="[ID]" style="height: 36px; padding: 0 12px; background: #070b10; border: 1px solid #27333f; border-radius: 4px; color: #f2f5f8; font: 400 14px/20px 'Roboto Mono', ui-monospace, Menlo, monospace; outline: 0;"></label>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #96a7b8;">Role</span><select style="height: 36px; padding: 0 10px; background: #070b10; border: 1px solid #27333f; border-radius: 4px; color: #f2f5f8; font: 400 14px/20px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;"><option>Operator</option><option>Supervisor</option><option>Maintainer</option></select></label>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 4px; font: 500 13px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.1px; cursor: pointer; white-space: nowrap; background: #4cc9f0; color: #070b10; border: 1px solid #4cc9f0; justify-content: center;">Sign in</button>
</form>
<div style="flex: 999 1 640px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px;">
<section aria-label="Operator layout" style="display: flex; flex-direction: column; gap: 10px; min-width: 0;">
<div style="display: flex; align-items: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #f2f5f8;">Operator sign-in loads</span></div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(8, 40px); gap: 6px; padding: 10px; background: #070b10; border: 1px solid #27333f; border-radius: 8px;"><div style="grid-column: 1 / span 4; grid-row: 1 / span 5; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Situation</span></div><div style="grid-column: 5 / span 2; grid-row: 1 / span 8; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Tracks</span></div><div style="grid-column: 1 / span 4; grid-row: 6 / span 3; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Alerts</span></div></div>
</section>
<section aria-label="Supervisor layout" style="display: flex; flex-direction: column; gap: 10px; min-width: 0;">
<div style="display: flex; align-items: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #f2f5f8;">Supervisor sign-in loads</span></div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(8, 40px); gap: 6px; padding: 10px; background: #070b10; border: 1px solid #27333f; border-radius: 8px;"><div style="grid-column: 1 / span 6; grid-row: 1 / span 3; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Operator activity</span></div><div style="grid-column: 1 / span 3; grid-row: 4 / span 5; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Health</span></div><div style="grid-column: 4 / span 3; grid-row: 4 / span 5; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Status</span></div></div>
</section>
<section aria-label="Maintainer layout" style="display: flex; flex-direction: column; gap: 10px; min-width: 0;">
<div style="display: flex; align-items: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a7b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #f2f5f8;">Maintainer sign-in loads</span></div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(8, 40px); gap: 6px; padding: 10px; background: #070b10; border: 1px solid #27333f; border-radius: 8px;"><div style="grid-column: 1 / span 2; grid-row: 1 / span 8; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Subsystems</span></div><div style="grid-column: 3 / span 4; grid-row: 1 / span 5; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Detail</span></div><div style="grid-column: 3 / span 4; grid-row: 6 / span 3; display: flex; align-items: flex-start; padding: 8px 10px; background: #141c26; border: 1px dashed #37475a; border-radius: 4px;"><span style="font: 500 11px/14px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.6px; text-transform: uppercase; color: #7a8ea2;">Readings</span></div></div>
</section>
</div>
</main>
</div>

</body>
</html>
